<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>q3</title>
</head>
<body>
    <button>Red</button>
    <button>green</button>
    <button>Blue</button>
 <div style="height: 500px; width: 80%; border: 2px solid black;"></div>


    <script>
        let btn1 = document.getElementsByTagName('button')[0];
        let btn2 = document.getElementsByTagName('button')[1];
        let btn3 = document.getElementsByTagName('button')[2];
        let div = document.querySelector('div');
        btn1.addEventListener("click",()=>{
              let confirmation = confirm("do you really want to change the colour to red ")
            if(confirmation){
                div.style.backgroundColor="red"
            }
        })
        btn2.addEventListener("click",()=>{
              let confirmation = confirm("do you really want to change the colour to  green ")
            if(confirmation){
                div.style.backgroundColor="green"
            }
        })
        btn3.addEventListener("click",()=>{
              let confirmation = confirm("do you really want to change the colour to blue ")
            if(confirmation){
                div.style.backgroundColor="blue"
            }
        })
    </script>
</body>
</html>
